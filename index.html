    <script>
      // Gracefully suppress benign Vite HMR WebSocket disconnect messages in sandboxed iframes
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason ? (event.reason.message || String(event.reason)) : '';
            if (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('websocket') !== -1 ||
              reason.indexOf('closed without opened') !== -1
            ) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('error', function(event) {
            var msg = event ? (event.message || String(event)) : '';
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('websocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1
            ) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
